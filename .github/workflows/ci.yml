name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -q -DskipTests package

      - name: Test
        run: mvn -B test

      - name: Smoke-test the command
        run: |
          out=$(echo '{"op":"from_read","html":"<p>Hello <b>world</b></p>","width":20}' | bin/html2text)
          test "$out" = '{"text":"Hello **world**\n"}'
